worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  upstream auth_svc         { server auth:8000; }
  upstream product_svc      { server product:8000; }
  upstream order_svc        { server order:8000; }
  upstream payment_svc      { server payment:8000; }
  upstream notification_svc { server notification:8000; }

  server {
    listen 80;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

 
    location /api/auth/         { proxy_pass http://auth_svc/auth/; }
    location /api/product/      { proxy_pass http://product_svc/product/; }
    location /api/order         { proxy_pass http://order_svc/order; }
    location /api/payment/      { proxy_pass http://payment_svc/payment/; }
    location /api/notification/ { proxy_pass http://notification_svc/notification/; }

    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }
  }
}
