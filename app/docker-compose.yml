services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AUTH_PW: ${AUTH_PW}
      PRODUCT_PW: ${PRODUCT_PW}
      ORDER_PW: ${ORDER_PW}
      PAYMENT_PW: ${PAYMENT_PW}
      NOTIFICATION_PW: ${NOTIFICATION_PW}
      EXPORTER_PW: ${EXPORTER_PW}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: sqs,secretsmanager
    ports:
      - "4566:4566"

  auth-service:
    build:
      context: .
      args:
        SERVICE_NAME: auth
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DB_USER: auth_user
      DB_PASSWORD: ${AUTH_PW}
      DB_SCHEMA: auth_schema
      DB_POOL_SIZE: "20"
      DB_MAX_OVERFLOW: "30"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  product-service:
    build:
      context: .
      args:
        SERVICE_NAME: product
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      DB_USER: product_user
      DB_PASSWORD: ${PRODUCT_PW}
      DB_SCHEMA: product_schema
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: .
      args:
        SERVICE_NAME: order
    ports:
      - "8003:8000"
    env_file:
      - .env
    environment:
      DB_USER: order_user
      DB_PASSWORD: ${ORDER_PW}
      DB_SCHEMA: order_schema
      PRODUCT_SERVICE_URL: "http://product-service:8000"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      product-service:
        condition: service_started

  payment-service:
    build:
      context: .
      args:
        SERVICE_NAME: payment
    ports:
      - "8004:8000"
    env_file:
      - .env
    environment:
      DB_USER: payment_user
      DB_PASSWORD: ${PAYMENT_PW}
      DB_SCHEMA: payment_schema
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: .
      args:
        SERVICE_NAME: notification
    ports:
      - "8005:8000"
    env_file:
      - .env
    environment:
      DB_USER: notification_user
      DB_PASSWORD: ${NOTIFICATION_PW}
      DB_SCHEMA: notification_schema
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started

  gateway:
    image: nginx:1.27-alpine
    profiles:
      - ui
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../eks-frontend:/usr/share/nginx/html:ro
    depends_on:
      auth-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
